# Обновления группируются: одна PR в неделю на экосистему вместо десятка мелких
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # Мажорные обновления (Spring Boot 4, Gradle 9) требуют миграции — делаются вручную
    ignore:
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Java остаётся на LTS 21 (как в distroless java21 и в CI); переход на новую LTS — вручную
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
