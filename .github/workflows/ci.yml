name: CI & Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: rbpo-backend

# Все actions закреплены по SHA коммита (защита от перезаписи тегов, см. GHSA-69fq-xp46-6x23).

jobs:
  # ── 1. Secret Scan — блокирует при найденном секрете ──────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Tests & Build ──────────────────────────────────────────────────────
  test-build:
    name: Tests & Build (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Run tests
        run: chmod +x gradlew && ./gradlew --no-daemon test

      - name: Build JAR
        run: ./gradlew --no-daemon bootJar

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbpo-backend-jar
          path: build/libs/*.jar
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore

  # ── 3. SAST — Semgrep ─────────────────────────────────────────────────────
  # Отчёт по всем находкам уходит в GitHub Security; блокируют только ERROR.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep report (SARIF)
        run: semgrep scan --config=p/java --config=p/owasp-top-ten --metrics=off --sarif --output=semgrep.sarif || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Semgrep gate (ERROR severity)
        run: semgrep scan --config=p/java --config=p/owasp-top-ten --metrics=off --severity=ERROR --error

  # ── 4. Container: Build, Trivy (image + Dockerfile), SBOM ─────────────────
  container-security:
    name: Docker Build, Scan (Trivy) & SBOM (Syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Trivy image report (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy image gate (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Trivy config gate (Dockerfile misconfigurations)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: SBOM (Syft, SPDX)
        if: always()
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          artifact-name: sbom-rbpo-backend.spdx.json
          format: spdx-json

  # ── 5. Publish & Sign (только main, после всех проверок) ──────────────────
  publish-and-sign:
    name: Publish to GHCR & Sign (cosign)
    runs-on: ubuntu-latest
    needs: [secret-scan, test-build, sast, container-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          echo "ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")" >> "$GITHUB_OUTPUT"

      - name: Sign image by digest (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

  # ── 6. Security Gate — одна обязательная проверка для branch protection ──
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, test-build, sast, container-security]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Secrets:   ${{ needs.secret-scan.result }}"
          echo "Tests:     ${{ needs.test-build.result }}"
          echo "SAST:      ${{ needs.sast.result }}"
          echo "Container: ${{ needs.container-security.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ Security gate failed"; exit 1
          fi
          echo "✅ All checks passed"
